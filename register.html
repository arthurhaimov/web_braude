<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mx-4">
        <h1 class="text-2xl font-semibold mb-6 text-center text-gray-800">Create Account</h1>
        <form id="registerForm">
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" minlength="6" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="6" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <label for="dob" class="block mb-2 text-sm font-medium text-gray-700">Date of Birth</label>
            <input type="date" id="dob" name="dob" required class="w-full p-3 mb-4 border rounded">
            <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors">Register</button>
            <a href="login.html" class="block text-center mt-4 text-blue-500 hover:underline">Already have an account? Login</a>
        </form>
    </div>
    <script src="register.js"></script>
</body>
</html>
