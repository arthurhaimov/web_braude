<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
  </head>
  <body class="min-h-screen bg-gray-100 p-6">
    <main class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 id="welcomeMessage" class="text-2xl font-semibold text-gray-800"></h1>
        <button id="logoutButton" type="button" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">Logout</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300">
          <thead class="bg-gray-200">
            <tr>
              <th class="border border-gray-300 p-3 text-left">Username</th>
              <th class="border border-gray-300 p-3 text-left">Email</th>
              <th class="border border-gray-300 p-3 text-left">Date of Birth</th>
              <th class="border border-gray-300 p-3 text-left">Role</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </main>
    <script type="module" src="/src/userManagement.js"></script>
  </body>
</html>
