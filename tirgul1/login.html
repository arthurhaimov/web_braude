<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="content">
  <div class="container">
    <h1>Login</h1>
    <form>
      <label for="userInput">Username or Email</label>
      <input type="text" id="userInput" name="username" autocomplete="username" placeholder="Enter username or email" required>
      <label for="passInput">Password</label>
      <input type="password" id="passInput" name="password" autocomplete="current-password" minlength="6" placeholder="Enter password" required>
      <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Login</button>
      <a href="register.html" class="block text-center w-full p-3 mt-4 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Register</a>
    </form>
  </div>
</body>
</html>
