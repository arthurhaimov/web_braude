<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mx-4">
    <h1 class="text-2xl font-semibold mb-6 text-center text-gray-800">Register</h1>
    <form>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required class="w-full p-3 mb-4 border border-gray-300 rounded">
      <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required class="w-full p-3 mb-4 border border-gray-300 rounded">
      <input type="password" id="password" name="password" placeholder="Password" minlength="6" autocomplete="new-password" required class="w-full p-3 mb-4 border border-gray-300 rounded">
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" minlength="6" autocomplete="new-password" required class="w-full p-3 mb-4 border border-gray-300 rounded">
      <label for="dob" class="block mb-2 text-sm font-medium text-gray-700">Date of Birth</label>
      <input type="date" id="dob" name="dob" required class="w-full p-3 mb-4 border border-gray-300 rounded">
      <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>
      <a href="login.html" class="block text-center mt-4 text-blue-500 hover:underline">Already have an account? Login</a>
    </form>
  </div>
</body>
</html>
