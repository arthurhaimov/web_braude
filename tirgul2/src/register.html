<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mx-4">
      <h1 class="text-2xl font-semibold mb-6 text-center text-gray-800">Create Account</h1>
      <form id="registerForm" action="/src/register.html" method="post">
        <input type="text" id="userInput" placeholder="Username" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="email" id="mailInput" placeholder="Email" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="password" id="passInput" placeholder="Password" minlength="6" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="password" id="confirmInput" placeholder="Confirm Password" minlength="6" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <label for="dateInput" class="block mb-2 text-sm font-medium text-gray-700">Date of Birth</label>
        <input type="date" id="dateInput" required class="w-full p-3 mb-4 border border-gray-300 rounded" />
        <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>
        <a href="/src/login.html" class="block text-center mt-4 text-blue-500 hover:underline">Already have an account? Login</a>
        <div id="registerMessage" class="mt-2 text-red-500 text-center text-sm"></div>
      </form>
    </div>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
