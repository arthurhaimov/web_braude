<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm mx-4">
      <h1 class="text-2xl font-semibold mb-6 text-center text-gray-800">Login</h1>
      <form id="loginForm" action="/src/login" method="post">
        <label for="userInput" class="block mb-2 text-sm font-medium text-gray-700">Username or Email</label>
        <input type="text" id="userInput" placeholder="Enter username or email" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <label for="passInput" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="passInput" placeholder="Password" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Login</button>
        <a href="/src/register.html" class="block text-center mt-4 px-4 py-3 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Register</a>
        <a href="#" onclick="alert('Forgot password functionality to be implemented.');" class="block text-right mt-4 text-blue-500 hover:underline">Forgot Password?</a>
        <div id="loginMessage" class="mt-2 text-red-500 text-center text-sm"></div>
      </form>
    </div>
    <script type="module" src="/src/users.js"></script>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
