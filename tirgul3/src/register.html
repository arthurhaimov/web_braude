<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mx-4">
      <h1 class="text-2xl font-semibold mb-6 text-center text-gray-800">Create Account</h1>
      <form id="registerForm" action="/src/register.html" method="post">
        <input type="text" id="userInput" placeholder="Username" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="email" id="mailInput" placeholder="Email" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="password" id="passInput" placeholder="Password" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="password" id="confirmInput" placeholder="Confirm Password" required class="w-full p-3 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <label for="dateInput" class="block mb-2 text-sm font-medium text-gray-700">Date of Birth</label>
        <input type="date" id="dateInput" required class="w-full p-3 mb-4 border border-gray-300 rounded" />
        <div id="arithmetic-captcha-container" class="space-y-2 mb-4">
          <label for="captcha-answer" class="block text-sm font-medium text-gray-700">Solve the CAPTCHA:</label>
          <div class="flex items-center space-x-4">
            <span id="arithmetic-challenge" class="text-lg font-semibold text-gray-800"></span>
            <button type="button" id="refresh-captcha" title="Refresh CAPTCHA">
              <img class="h-10" src="https://logosandtypes.com/wp-content/uploads/2024/01/recaptcha.svg" alt="CAPTCHA">
            </button>
          </div>
          <input type="text" id="captcha-answer" name="captcha-answer" class="appearance-none rounded-md block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900" placeholder="Enter the answer">
          <p id="arithmetic-error" class="mt-1 text-sm text-red-500 hidden">Incorrect CAPTCHA answer.</p>
          <p id="captcha-attempts-error" class="mt-1 text-sm text-red-500 hidden">Too many incorrect CAPTCHA attempts.</p>
        </div>
        <button type="submit" class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>
        <a href="/src/login.html" class="block text-center mt-4 text-blue-500 hover:underline">Already have an account? Login</a>
        <div id="registerMessage" class="mt-2 text-red-500 text-center text-sm"></div>
      </form>
    </div>
    <script type="module" src="/src/captcha.js"></script>
    <script type="module" src="/src/users.js"></script>
  </body>
</html>
